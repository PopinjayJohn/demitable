name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make lint
        run: make lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: sync frontend into embed dir
        run: |
          rm -rf internal/server/webdist
          mkdir -p internal/server/webdist
          cp -r web/dist/. internal/server/webdist/
          touch internal/server/webdist/.gitkeep
      # The corpus is a transient build input and is not in the repository.
      # The suites that need it skip themselves; see the corpus job below.
      - name: go test
        run: go test -race ./...
      - name: go test without the race detector
        run: go test ./...

  corpus:
    name: corpus
    runs-on: ubuntu-latest
    # Runs the golden-corpus suites (go test -run Corpus) against the
    # committed SRD vault under dev/srd-vault. Gated on that directory so
    # the corpus cannot silently stop being checked.
    if: hashFiles('dev/srd-vault/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: the golden-corpus suites
        run: go test -run Corpus ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: sync frontend into embed dir
        run: |
          rm -rf internal/server/webdist
          mkdir -p internal/server/webdist
          cp -r web/dist/. internal/server/webdist/
          touch internal/server/webdist/.gitkeep
      # A single cgo dependency would break the whole distribution story,
      # so CGO_ENABLED=0 is enforced here rather than hoped for.
      - name: cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/demitable ./cmd/demitable
      - name: the binary is self-contained
        run: |
          # The size is reported, not gated (ADR-0060). What is checked is
          # the invariant that matters: one file, no cgo, no runtime
          # dependencies (ADR-0005).
          size=$(stat -c %s dist/demitable)
          echo "binary: $size bytes"
          if ! go version -m dist/demitable | grep -q 'CGO_ENABLED=0'; then
            echo "the binary was not built with CGO_ENABLED=0"
            go version -m dist/demitable || true
            exit 1
          fi
          # A cgo-linked binary would need libraries the user does not have.
          # Only ELF can be checked this way on a Linux runner; the build
          # settings above cover the other four formats.
          if [ "${{ matrix.goos }}" = "linux" ]; then
            if ldd dist/demitable 2>&1 | grep -qv 'not a dynamic executable'; then
              echo "the binary has dynamic library dependencies:"
              ldd dist/demitable || true
              exit 1
            fi
          fi

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: sync frontend into embed dir
        run: |
          rm -rf internal/server/webdist
          mkdir -p internal/server/webdist
          cp -r web/dist/. internal/server/webdist/
          touch internal/server/webdist/.gitkeep
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/demitable ./cmd/demitable
      - name: it starts, answers, and shuts down cleanly
        run: |
          ./dist/demitable --port 8099 --no-browser --log-format json &
          pid=$!
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8099/api/health >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8099/api/health
          echo
          # SIGTERM must exit 0: the phase-1 plan requires graceful shutdown.
          kill -TERM $pid
          wait $pid
          echo "exited $?"

  e2e:
    name: e2e (shadow-host matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: install e2e deps
        working-directory: e2e
        run: npm ci
      - name: install playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox
      - name: run shadow-host matrix
        working-directory: e2e
        run: npx playwright test --project=chromium --project=firefox
