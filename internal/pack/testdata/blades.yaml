id: blades
name: Blades in the Dark
version: 1.0.0

attributes:
  - { key: rating, label: Rating, type: number, default: 1, min: 0, max: 4 }
  - { key: opposition, label: Opposition, type: number, default: 1, min: 0, max: 6 }

resources:
  - { key: clock_harlan, label: Harlan's Clock, kind: track, size: 6, segments: 2, filled: 2, visibility: party }
  - { key: heat, label: Heat, kind: pool, default: 0, max: 9, visibility: owner }
  - { key: rep, label: Reputation, kind: pool, default: 0, max: 12, visibility: party }

conditions:
  - { key: harm, label: Harm, kind: scale, steps: [0, 1, 2, 3], value: 1 }
  - { key: trauma, label: Trauma, kind: scale, steps: [0, 1, 2, 3, 4], value: 0 }

difficulty:
  model: opposition-dice
  clockPressure: true

dice:
  default: "1d6"
  direction: high
  degreesOfSuccess: [partial, full, critical]
  workflows:
    - key: action
      label: Action Roll
      dice: "{rating}d6"
      vs: "{opposition}d6"
      outcome: highest-count
    - key: resistance
      label: Resistance Roll
      dice: "{rating}d6"
      vs: "2d6"
      outcome: highest-count

secrets:
  calloutTypes: [secret, gm-only, hidden]
  codeBlockKeys: [gm, secret]

views:
  sheet:
    - { type: attribute, key: attributes.rating, label: Rating }
    - { type: resource, key: resources.clock_harlan, label: Clock }

content:
  - id: character
    label: Character
    visibility: party
    fields:
      - { key: alias, label: Alias, type: text }
      - { key: role, label: Role, type: text }
      - { key: heritage, label: Heritage, type: text }
      - { key: background, label: Background, type: text }
      - { key: vice, label: Vice, type: text }
  - id: npc
    label: NPC
    visibility: party
    fields:
      - { key: alias, label: Alias, type: text }
      - { key: faction, label: Faction, type: text }
  - id: creature
    label: Creature
    visibility: party
    fields:
      - { key: threat, label: Threat, type: text }
  - id: crew
    label: Crew
    visibility: party
    fields:
      - { key: crew_type, label: Crew Type, type: text }
      - { key: tier, label: Tier, type: number }
      - { key: heat, label: Heat, type: number }
      - { key: rep, label: Rep, type: number }
  - id: faction
    label: Faction
    visibility: party
    fields:
      - { key: tier, label: Tier, type: number }
      - { key: hold, label: Hold, type: text }
      - { key: status, label: Status, type: text }