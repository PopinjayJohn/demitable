id: dnd5e
name: D&D 5e (SRD 5.2)
version: 1.0.0
content:
  - id: class
    label: Class
    visibility: party
    fields:
      - { key: hit_die, label: Hit Die, type: number }
      - { key: primary_abilities, label: Primary Abilities, type: list }
      - { key: saving_throws, label: Saving Throws, type: list }
      - { key: spellcasting_ability, label: Spellcasting Ability, type: text }
      - { key: caster_progression, label: Caster Progression, type: text }
      - { key: prepared_spells, label: Prepared Spells, type: text }
      - { key: cantrip_progression, label: Cantrip Progression, type: text }
      - { key: proficiencies, label: Proficiencies, type: object }
      - { key: features, label: Features, type: list }
  - id: species
    label: Species
    visibility: party
    fields:
      - { key: size, label: Size, type: text }
      - { key: speed, label: Speed, type: object }
      - { key: ability_bonuses, label: Ability Bonuses, type: object }
      - { key: languages, label: Languages, type: list }
      - { key: traits, label: Traits, type: list }
  - id: background
    label: Background
    visibility: party
    fields:
      - { key: ability_choices, label: Ability Choices, type: list }
      - { key: skill_proficiencies, label: Skill Proficiencies, type: list }
      - { key: tool_proficiencies, label: Tool Proficiencies, type: list }
      - { key: starting_equipment, label: Starting Equipment, type: list }
      - { key: feats, label: Feats, type: list }
  - id: feat
    label: Feat
    visibility: party
    fields:
      - { key: category, label: Category, type: text }
      - { key: prerequisites, label: Prerequisites, type: list }
      - { key: ability, label: Ability, type: list }
  - id: spell
    label: Spell
    visibility: party
    fields:
      - { key: level, label: Level, type: number }
      - { key: school, label: School, type: text }
      - { key: classes, label: Classes, type: list }
      - { key: casting_time, label: Casting Time, type: text }
      - { key: range, label: Range, type: text }
      - { key: components, label: Components, type: text }
      - { key: duration, label: Duration, type: text }
  - id: monster
    label: Monster
    visibility: party
    fields:
      - { key: size, label: Size, type: text }
      - { key: type, label: Type, type: text }
      - { key: alignment, label: Alignment, type: list }
      - { key: ac, label: Armour Class, type: number }
      - { key: hp, label: Hit Points, type: number }
      - { key: speed, label: Speed, type: object }
      - { key: abilities, label: Abilities, type: object }
      - { key: senses, label: Senses, type: list }
      - { key: passive_perception, label: Passive Perception, type: number }
      - { key: cr, label: Challenge Rating, type: text }
      - { key: cr_xp, label: XP, type: number }
      - { key: immune, label: Immunities, type: list }
      - { key: resist, label: Resistances, type: list }
      - { key: vulnerable, label: Vulnerabilities, type: list }
      - { key: condition_immunities, label: Condition Immunities, type: list }
      - { key: languages, label: Languages, type: list }
  - id: optionalfeature
    label: Optional Feature
    visibility: party
    fields:
      - { key: featureType, label: Feature Type, type: list }
      - { key: prerequisites, label: Prerequisites, type: list }
  - id: variantrule
    label: Variant Rule
    visibility: party
    fields:
      - { key: rule_type, label: Rule Type, type: text }
      - { key: rule, label: Rule, type: text }
  - id: item
    label: Item
    visibility: party
    fields:
      - { key: type, label: Type, type: text }
      - { key: rarity, label: Rarity, type: text }
      - { key: reqAttune, label: Requires Attunement, type: text }
  - id: table
    label: Table
    visibility: party
    fields:
      - { key: faces, label: Faces, type: list }
  - id: trap
    label: Trap
    visibility: party
    fields:
      - { key: type, label: Type, type: text }
  - id: deck
    label: Deck
    visibility: party
    fields: []
  - id: vehicle
    label: Vehicle
    visibility: party
    fields: []
  - id: reference
    label: Reference
    visibility: party
    fields: []

attributes:
  - { key: str, label: Strength, type: number, default: 10, min: 1, max: 30 }
  - { key: dex, label: Dexterity, type: number, default: 10, min: 1, max: 30 }
  - { key: con, label: Constitution, type: number, default: 10, min: 1, max: 30 }
  - { key: int, label: Intelligence, type: number, default: 10, min: 1, max: 30 }
  - { key: wis, label: Wisdom, type: number, default: 10, min: 1, max: 30 }
  - { key: cha, label: Charisma, type: number, default: 10, min: 1, max: 30 }

resources:
  - { key: hp, label: Hit Points, kind: pool, default: 1, maxFormula: max_hp, visibility: owner }
  - { key: ac, label: Armour Class, kind: defence, default: 10 }

conditions:
  - { key: prone, label: Prone, kind: flag }
  - { key: poisoned, label: Poisoned, kind: flag }

progression:
  levels: { max: 20, label: Level }

difficulty:
  model: xp-budget
  budgetPerLevel: 4

formulas:
  max_hp: "10 + attributes.con"
  con_mod: "floor((attributes.con - 10) / 2)"

dice:
  default: "1d20"
  direction: high
  workflows:
    - key: attack
      label: Attack Roll
      dice: "1d20"
      against: resources.ac
      bonus: attack_bonus
    - key: save
      label: Saving Throw
      dice: "1d20"
      against: dc
      bonus: save_bonus
    - key: check
      label: Ability Check
      dice: "1d20"
      against: dc
      bonus: check_bonus

secrets:
  calloutTypes: [secret, gm-only, hidden]
  codeBlockKeys: [gm, secret]
